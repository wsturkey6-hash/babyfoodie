<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E5">
  <title>寶寶｜babyfoodie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div class="app">
    <header class="baby-header">
      <div class="baby-setup">
        <span class="baby-setup__avatar"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#baby"/></svg></span>
        <span class="baby-setup__text">還沒設定寶寶資料</span>
      </div>
    </header>
    <main id="main" class="page" tabindex="-1">
      <h1 class="page-title">寶寶</h1>
      <section class="card placeholder">
        <span class="sticker">製作中</span>
        <p>這裡可以輸入寶寶的名字和生日，並算出目前月齡。</p>
      </section>
    </main>
  </div>
  <nav class="tabbar" aria-label="主要頁面">
    <a class="tabbar__tab" href="index.html">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#list"/></svg>
      <span>紀錄</span>
    </a>
    <a class="tabbar__tab" href="table.html">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#grid"/></svg>
      <span>試敏表</span>
    </a>
    <a class="tabbar__tab" href="baby.html" aria-current="page">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#baby"/></svg>
      <span>寶寶</span>
    </a>
  </nav>
</body>
</html>
