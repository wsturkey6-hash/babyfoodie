<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E5">
  <title>紀錄｜babyfoodie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/core.js"></script>
  <script src="js/record-list.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div class="app">
    <header class="baby-header">
      <a class="baby-setup" href="baby.html">
        <span class="baby-setup__avatar"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#baby"/></svg></span>
        <span class="baby-setup__text">設定寶寶資料</span>
        <svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg>
      </a>
    </header>
    <script>babyfoodie.renderBabyHeader(document.querySelector('.baby-header'), { link: true });</script>
    <main id="main" class="page" tabindex="-1">
      <h1 class="page-title">紀錄</h1>
      <a class="button button--primary" href="record.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#plus"/></svg>新增紀錄</a>
      <p class="toast" id="flash" role="status" aria-live="polite"></p>
      <div class="record-list" id="record-list"></div>
      <script>babyfoodie.renderRecordList(document.getElementById('record-list'));</script>
    </main>
  </div>
  <nav class="tabbar" aria-label="主要頁面">
    <a class="tabbar__tab" href="index.html" aria-current="page">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#list"/></svg>
      <span>紀錄</span>
    </a>
    <a class="tabbar__tab" href="table.html">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#grid"/></svg>
      <span>試敏表</span>
    </a>
    <a class="tabbar__tab" href="baby.html">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#baby"/></svg>
      <span>寶寶</span>
    </a>
  </nav>
</body>
</html>
